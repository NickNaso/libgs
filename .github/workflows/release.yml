name: "Publish the release archives"
on:
  release:
    types: [published]

jobs:

  build:
    uses: ./.github/workflows/test.yml

  build-zig:
    uses: ./.github/workflows/linux-zig.yml

  # makePackages.js creates the npm packages from these archives.
  publish:
    needs: [build, build-zig]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./builds/
          pattern: gs-*
          merge-multiple: true

      - name: List the archives
        run: ls -la builds

      - name: Upload the archives to the release
        uses: softprops/action-gh-release@v2
        with:
          files: builds/gs-*.tar.gz
          fail_on_unmatched_files: true
