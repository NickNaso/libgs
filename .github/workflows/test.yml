name: "Release"
on: [workflow_call,push, pull_request]

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yml
  build-macos:
    uses: ./.github/workflows/macos.yml
  # Linux (glibc and musl) and FreeBSD.
  build-zig:
    uses: ./.github/workflows/zig.yml

  test:
    # The artifacts only exist once the builds have finished.
    needs: [build-windows, build-macos, build-zig]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vitest requires Node.js 22.12 or later, which the runner may not have.
      - name: Install Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Download a Build Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          path: ./builds/

      - name: Start tests 
        run: npm test

