name: 'Build for Windows'
on: [workflow_call]

jobs:
    build:
      runs-on: ${{ matrix.os }}
      strategy:
          fail-fast: false
          matrix:
              node-version: [20.x]
              # psi\msvc32.mak builds for the architecture of the compiler on
              # the PATH, set by msvc-arch.
              include:
                - architecture: x64
                  os: windows-latest
                  msvc-arch: x64
                  machine: x64
                - architecture: x86
                  os: windows-latest
                  msvc-arch: amd64_x86
                  machine: x86
                - architecture: arm64
                  os: windows-11-arm
                  msvc-arch: arm64
                  machine: ARM64
      steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Cache
            uses: actions/cache@v4
            id: npm-cache
            with:
              path: |
                  ~/.npm
                  node_modules/.cache
              key: ${{ matrix.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package.json') }}
              restore-keys: |
                  ${{ matrix.os }}-node-${{ matrix.node-version }}-
          
          - name: Install Node.js ${{ matrix.node-version }}
            uses: actions/setup-node@v4
            with:
              node-version: ${{ matrix.node-version }}
              cache: 'npm'
              cache-dependency-path: package.json
              
          - name: Install Node.js modules ...
            run: npm install

          - name: Install Visual Studio
            uses: ilammy/msvc-dev-cmd@v1
            with:
              arch: ${{ matrix.msvc-arch }}

          - name: Environment information
            run: npx envinfo
          
          - name: Build
            run: | 
              node index.js -p windows -a ${{ matrix.architecture }}

          - name: Check the architecture of the libraries
            shell: pwsh
            run: |
              foreach ($dll in Get-ChildItem ghostpdl\bin\*.dll) {
                $machine = dumpbin /headers $dll.FullName | Select-String ' machine \('
                "$($dll.Name): $machine"
                if ("$machine" -notmatch '\(${{ matrix.machine }}\)') {
                  throw "$($dll.Name) is not built for ${{ matrix.machine }}"
                }
              }

          - name: Upload build Artifact
            uses: actions/upload-artifact@v4
            with:
              name: gs-win32-${{ matrix.architecture }}.tar.gz
              path: ./gs-win32-${{ matrix.architecture }}.tar.gz
              if-no-files-found: error
