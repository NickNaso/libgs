name: 'Build for linux with Zig'
on:
    workflow_call:
    workflow_dispatch:
    pull_request:
    push:
        branches: [feat/zig-compiler]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                  - target: aarch64-linux-musl
                    docker-platform: linux/arm64
                    image: alpine:3.20
                  - target: armv7-linux-musleabihf
                    docker-platform: linux/arm/v7
                    image: alpine:3.20
                  - target: armv6-linux-musleabihf
                    docker-platform: linux/arm/v6
                    image: alpine:3.20
                  - target: riscv64-linux-gnu
                    docker-platform: linux/riscv64
                    image: ubuntu:24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Node.js 20.x
              uses: actions/setup-node@v4
              with:
                node-version: 20.x
                cache: 'npm'
                cache-dependency-path: package.json

            - name: Install Zig
              uses: mlugg/setup-zig@v2
              with:
                version: 0.16.0

            - name: Install Node.js modules ...
              run: npm install

            - name: Environment information
              run: |
                npx envinfo
                zig version

            - name: Build
              run: node index.js -z ${{ matrix.target }}

            # Links an executable against the static library, to check that
            # gs.a is complete and runs on the target.
            - name: Build test executable
              run: |
                make -C ghostpdl libgsexe
                file ghostpdl/bin/gs_aexe

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Smoke test on ${{ matrix.image }} (${{ matrix.docker-platform }})
              run: |
                docker run --rm --platform ${{ matrix.docker-platform }} \
                  -v "$PWD/ghostpdl:/gs" -w /gs ${{ matrix.image }} sh -ec '
                    uname -m
                    test "$(./bin/gs_aexe -q -dNODISPLAY -dBATCH -dNOPAUSE -c "3 4 add == quit")" = 7
                    ./bin/gs_aexe -q -dBATCH -dNOPAUSE -sDEVICE=png16m -o tiger.png examples/tiger.eps
                    test -s tiger.png
                  '

            - name: Upload build Artifact
              uses: actions/upload-artifact@v4
              with:
                name: gs-${{ matrix.target }}
                path: ./gs-*.tar.gz
                if-no-files-found: error
